---
cluster_domain_name: bu-ist-demo
base_domain: int.massopen.cloud

# install_drive_serial/etcd_drive_wwn confirmed via
# `lsblk -o NAME,SIZE,SERIAL,WWN` against the live master nodes. etcd_drive_wwn
# is matched by hostname in 98-master-var-lib-etcd.j2, resolved via
# /dev/disk/by-id/wwn-<value>. etcd_drive_wwn MUST be quoted -- YAML parses an
# unquoted 0x... value as a hex integer, and Jinja renders it back in decimal.

# TODO: the mac/serial/wwn values below come from booting each node on
# http://10.2.0.82/boot/discovery.iso and reading http://<node-ip>/index.txt.

# host info for MOC-R4PAC10U31-S1A
master1_hostname: "moc-r4pac10u31-s1a"
master1_ip: "10.20.26.21"
master1_mac: ""
master1_install_drive_serial: ""
master1_etcd_drive_wwn: ""

# host info for MOC-R4PAC10U33-S1D
master2_hostname: "moc-r4pac10u33-s1d"
master2_ip: "10.20.26.22"
master2_mac: ""
master2_install_drive_serial: ""
master2_etcd_drive_wwn: ""

# host info for MOC-R4PAC10U35-S1A
master3_hostname: "moc-r4pac10u35-s1a"
master3_ip: "10.20.26.23"
master3_mac: ""
master3_install_drive_serial: ""
master3_etcd_drive_wwn: ""

machine_network: 10.20.26.0/23
rendezvous_ip: 10.20.26.20
gateway_ip: 10.20.26.1
dns_ip: 8.8.8.8
cluster_network: 10.128.0.0/14
svc_network: 172.30.0.0/16

ntp: us.pool.ntp.org

api_ip: 10.20.27.11
ingress_ip: 10.20.27.12

fips_enabled: false
diskencryption_mode: ""

ssh_public_key: >-
  {{ lookup("ansible.builtin.file", [playbook_dir, "credentials", "bu-ist-demo-infra", "bu-ist-demo-infra-key.pub"]|join("/")) }}
